start_drying:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: bambuddy
              model: AMS 2 Pro
            - integration: bambuddy
              model: AMS HT
    temperature:
      required: true
      default: 55
      selector:
        number:
          min: 45
          max: 85
          step: 1
          unit_of_measurement: °C
    duration:
      required: true
      default: 8
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: h
