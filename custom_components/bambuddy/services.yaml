move_axis:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: bambuddy
          # Printers only: AMS units and BamBuddy itself have no enum sensor.
          entity:
            integration: bambuddy
            domain: sensor
            device_class: enum
    axis:
      required: true
      selector:
        select:
          options:
            - value: "x"
              label: "X"
            - value: "y"
              label: "Y"
            - value: "z"
              label: "Z"
    distance:
      required: true
      default: 1
      selector:
        number:
          min: -200
          max: 200
          step: 0.1
          unit_of_measurement: mm
          mode: box
